name: Lambda Pipeline

on:
  push:
    branches: ["develop", "main"]

  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["develop", "main"]

jobs:
  terraform:
    name: Deploy authentication Lambda and API Gateway
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    env:
      TF_VAR_environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
      TF_VAR_db_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Lambda dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Lambda tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -input=false -reconfigure -backend-config="key=lambda/${TF_VAR_environment}.tfstate"

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra
        run: terraform plan -input=false -var-file="../environments/${TF_VAR_environment}.tfvars"

      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -input=false -auto-approve -var-file="../environments/${TF_VAR_environment}.tfvars"

