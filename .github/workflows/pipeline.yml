name: Lambda Pipeline

on:
  push:
    branches: ["develop", "main"]

  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  checks:
    name: Test and validate Lambda package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lambda dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Lambda tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Verify Function URL security defaults
        run: python -m unittest infra.test_function_url -v

      - name: Test AWS account identity guard
        run: python -m unittest discover -s scripts -p "test_verify_aws_account.py" -v

      - name: Validate Lambda package with Docker
        run: |
          bash ./build.sh
          docker run --rm --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE/build:/package:ro" \
            python:3.12-slim \
            -c 'test -f /package/handler.py && PYTHONPYCACHEPREFIX=/tmp/pycache python -m compileall -q /package'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (sem backend)
        working-directory: ./infra
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

  terraform-plan:
    name: Terraform Plan authentication Lambda
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    env:
      TF_VAR_environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_role_arn: ${{ vars.AWS_LAMBDA_EXECUTION_ROLE_ARN }}
      TF_VAR_terraform_state_bucket: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_infra_state_key: ${{ vars.AWS_INFRA_STATE_KEY }}
      TF_VAR_rds_state_key: ${{ vars.AWS_RDS_STATE_KEY }}
      TF_VAR_db_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Lambda package for Terraform Plan
        run: bash ./build.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Verify expected AWS account
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        run: python scripts/verify_aws_account.py

      - name: Validate environment-specific state configuration
        env:
          DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
          TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY }}
          INFRA_STATE_KEY: ${{ vars.AWS_INFRA_STATE_KEY }}
          RDS_STATE_KEY: ${{ vars.AWS_RDS_STATE_KEY }}
          LAMBDA_ROLE_ARN: ${{ vars.AWS_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          test -n "$INFRA_STATE_KEY"
          test -n "$RDS_STATE_KEY"
          case "$DEPLOY_ENVIRONMENT" in
            production)
              [[ "$TF_STATE_BUCKET" == *production* && "$LAMBDA_ROLE_ARN" == *production* ]]
              [[ "$TF_STATE_KEY" == *production* && "$INFRA_STATE_KEY" == *production* && "$RDS_STATE_KEY" == *production* ]]
              [[ "$TF_STATE_BUCKET$TF_STATE_KEY$INFRA_STATE_KEY$RDS_STATE_KEY$LAMBDA_ROLE_ARN" != *homolog* ]]
              ;;
            homolog)
              [[ "$TF_STATE_BUCKET" == *homolog* && "$LAMBDA_ROLE_ARN" == *homolog* ]]
              [[ "$TF_STATE_KEY" == *homolog* && "$INFRA_STATE_KEY" == *homolog* && "$RDS_STATE_KEY" == *homolog* ]]
              [[ "$TF_STATE_BUCKET$TF_STATE_KEY$INFRA_STATE_KEY$RDS_STATE_KEY$LAMBDA_ROLE_ARN" != *production* ]]
              ;;
            *) exit 1 ;;
          esac
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" > /dev/null

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra
        # use_lockfile requer GetObject/PutObject/DeleteObject no objeto .tflock; permissões efetivas do bucket/role não são verificáveis sem acesso AWS.
        run: terraform init -input=false -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra
        run: terraform plan -input=false -no-color
